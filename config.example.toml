[subtitle_sources]
# Per-provider search budget in seconds; slow providers are dropped with a warning.
provider_timeout_s = 20

[subtitle_sources.opensubtitles]
enabled = true
api_key = "YOUR_API_KEY_HERE"
username = ""
password = ""
enable_org_fallback = false

[subtitle_sources.subdl]
enabled = true
api_key = ""

[subtitle_sources.assrt]
enabled = false
token = ""

[languages]
source = "en"
target = "zh"

[capture]
region = []
interval_ms = 1500
ocr_language = "en"

[matching]
fuzzy_threshold = 65
window_size = 30
window_backward = 5

[translation]
endpoint = "http://127.0.0.1:5273/v1"
model = ""
timeout_s = 30
batch_size = 5

[overlay]
port = 8765
font_size = 28
font_family = "Aptos"
text_color = "#FFFFFF"
bg_color = "rgba(0,0,0,0.75)"
position = "bottom"
theme = "glass-cinematic"
radius_px = 28
padding_px = 20
max_width_vw = 78
blur_px = 20
shadow_strength = 0.45
offset_pct = 10
animation_ms = 220

[debug]
mode = false
