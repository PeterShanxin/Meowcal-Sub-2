<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capture HUD</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="capture-hud.css">
</head>
<body class="hud-body">
  <main id="hud-root" class="hud-root">
    <div id="capture-frame" class="capture-frame pulse">
      <div id="hud-status" class="hud-status">
        <span id="hud-status-chip" class="status-chip idle">Idle</span>
        <span id="hud-status-note" class="hud-status-note">Waiting to start.</span>
      </div>
      <div id="hud-controls" class="hud-controls hidden">
        <button id="hud-settings-button" type="button">Settings</button>
        <button id="hud-stop-button" type="button" class="danger">Stop Translation</button>
      </div>
      <div class="capture-corners" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <section id="subtitle-shell" class="subtitle-shell hidden">
      <p id="subtitle-text" class="subtitle-text"></p>
    </section>
  </main>
  <script src="capture-hud.js" type="module"></script>
</body>
</html>
