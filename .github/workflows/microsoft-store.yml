name: Microsoft Store package

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/microsoft-store.yml'
      - 'store/**'
      - 'scripts/build-store.ps1'
      - 'scripts/build-windows-release.ps1'
      - 'scripts/windows-sdk-tools.ps1'
      - 'scripts/inspect-installer-window.ps1'
      - 'scripts/test-installed-store.ps1'
      - 'scripts/verify_store_bundle.py'
      - 'scripts/check_store_release_payload.py'
      - 'scripts/store-*.mjs'
      - '.github/workflows/store-release-sync.yml'
      - 'tests/store-release-sync.test.mjs'
      - 'tests/test_store_release_payload.py'
      - 'scripts/store_logos.py'
      - 'src-tauri/src/store.rs'
      - 'src-tauri/src/backend_process.rs'
      - 'src-tauri/src/config_port.rs'
      - 'src-tauri/src/updater.rs'

permissions:
  contents: read

jobs:
  release-gate:
    name: Verify Store release source
    if: >-
      github.event_name == 'release' &&
      github.repository == 'PeterShanxin/Meowcal-Sub-2' &&
      !github.event.release.draft && !github.event.release.prerelease &&
      (github.actor == 'PeterShanxin' || github.actor == 'ianmeowmeow') &&
      (github.triggering_actor == 'PeterShanxin' || github.triggering_actor == 'ianmeowmeow') &&
      vars.STORE_RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify the latest stable release and its exact source
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_RELEASE_AUTOMATION_ENABLED: ${{ vars.STORE_RELEASE_AUTOMATION_ENABLED }}
          STORE_FIRST_RELEASE_TAG: ${{ vars.STORE_FIRST_RELEASE_TAG }}
          STORE_RELEASE_NOT_BEFORE: ${{ vars.STORE_RELEASE_NOT_BEFORE }}
        run: |
          set -euo pipefail
          version=$(node scripts/store-release-gate.mjs)
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: release-gate
    if: >-
      ${{ !cancelled() &&
      (github.event_name != 'release' || needs.release-gate.result == 'success') }}
    name: Store ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: windows-2025}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/meocosub2/overlay/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r config/backend-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix src/meocosub2/overlay/ui ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Build Store edition
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build-store.ps1 -Architecture ${{ matrix.arch }}
      - name: Activate installed package and verify private Studio settings
        shell: powershell
        run: ./scripts/test-installed-store.ps1 -Package (Get-Item dist/*.msix) -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x64'
        with:
          name: store-catalog${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: dist/MeowcalSub2-StoreLogo-300.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package-${{ matrix.arch }}${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 14
  bundle:
    name: Verify Store submission bundle
    needs: [package, release-gate]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: store-package-*${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: packages
          merge-multiple: true
      - name: Bundle both native packages and check original payloads
        shell: pwsh
        run: |
          . ./scripts/windows-sdk-tools.ps1
          $version = ([xml](Get-Content store/AppxManifest.xml -Raw)).Package.Identity.Version
          $output = "MeowcalSub2-$version.msixbundle"
          $makeAppx = Get-WindowsSdkTool 'makeappx.exe'
          & $makeAppx bundle /d packages /p $output /bv $version /o
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_store_bundle.py $output --commit (git rev-parse HEAD) --makeappx $makeAppx
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "$((Get-FileHash $output).Hash.ToLowerInvariant())  $output" | Set-Content SHA256SUMS.txt
      - name: Record the exact release provenance
        if: github.event_name == 'release'
        shell: pwsh
        env:
          BUILD_APP_VERSION: ${{ needs.release-gate.outputs.version }}
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          @{
            releaseId = $event.release.id
            appVersion = $env:BUILD_APP_VERSION
            commit = (git rev-parse HEAD)
          } | ConvertTo-Json | Set-Content release-provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-submission${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: |
            *.msixbundle
            SHA256SUMS.txt
            release-provenance.json
          if-no-files-found: error
          retention-days: 14
