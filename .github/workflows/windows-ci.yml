# Every gate lives in scripts/verify.ps1, which a developer runs locally. This
# workflow installs the documented prerequisites and calls it, so CI and a
# developer cannot enforce two different policies.
#
# What a green run proves: formatting, lint, types, the Python/Rust/studio test
# suites, the served dashboard, and the maintainability ratchets.
#
# What it cannot prove: OCR, WebView2 rendering, the capture selector, and the
# overlay plate. Those need a real Windows run of the app, described in
# docs/AGENT_GUIDE.md.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-x64:
    name: Verify x64
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        id: core-candidate
        shell: pwsh
        run: |
          $commit = .\scripts\prepare-core-candidate.ps1 -ResolveCommit
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        uses: actions/checkout@v6
        with:
          repository: PeterShanxin/Meowcal-Sub
          ref: ${{ steps.core-candidate.outputs.commit }}
          path: .meowcal-core-candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/meocosub2/overlay/ui/package-lock.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install studio dependencies
        run: npm --prefix src\meocosub2\overlay\ui ci

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Verify
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .\config\meowcal-core.lock.json) {
            .\scripts\verify.ps1
          } else {
            .\scripts\verify.ps1 -CoreCandidateSource .\.meowcal-core-candidate
          }

  verify-arm64:
    name: Verify ARM64
    runs-on: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        id: core-candidate
        shell: pwsh
        run: |
          $commit = .\scripts\prepare-core-candidate.ps1 -ResolveCommit
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        uses: actions/checkout@v6
        with:
          repository: PeterShanxin/Meowcal-Sub
          ref: ${{ steps.core-candidate.outputs.commit }}
          path: .meowcal-core-candidate
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/meocosub2/overlay/ui/package-lock.json"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install studio dependencies
        run: npm --prefix src\meocosub2\overlay\ui ci

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Verify
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          if (Test-Path -LiteralPath .\config\meowcal-core.lock.json) {
            .\scripts\verify.ps1
          } else {
            .\scripts\verify.ps1 -CoreCandidateSource .\.meowcal-core-candidate
          }
