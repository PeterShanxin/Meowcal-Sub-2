name: Windows release artifacts

on:
  workflow_dispatch:
  push:
    branches: ['release/**']
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      signed-updater: ${{ steps.package.outputs.signed-updater }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          architecture: ${{ matrix.architecture }}
      - name: Check app version and release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python scripts/check_app_version.py --tag $env:GITHUB_REF_NAME --require-head-tag
          } else {
            python scripts/check_app_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/meocosub2/overlay/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install verification dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r config/backend-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/meocosub2/overlay/ui ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 1
        run: .\scripts\verify.ps1
      - name: Build and smoke-test Windows distribution
        id: package
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 1
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          MEOWCAL_UPDATER_PUBLIC_KEY: ${{ github.ref_type == 'tag' && vars.MEOWCAL_UPDATER_PUBLIC_KEY || '' }}
        run: |
          $arguments = @{ Architecture = '${{ matrix.architecture }}' }
          $signedUpdater = & .\scripts\select-updater-signing.ps1 `
            -ReleaseTag:($env:GITHUB_REF_TYPE -eq 'tag') `
            -PrivateKeyConfigured:(![string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) `
            -PublicKeyConfigured:(![string]::IsNullOrWhiteSpace($env:MEOWCAL_UPDATER_PUBLIC_KEY))
          "signed-updater=$($signedUpdater.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $arguments.Tag = $env:GITHUB_REF_NAME
            $arguments.SignedUpdater = $signedUpdater
          }
          .\scripts\build-windows-release.ps1 @arguments
      - name: Upload artifacts for native acceptance
        uses: actions/upload-artifact@v7
        with:
          name: meowcal-sub-2-windows-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/*-setup.exe.sig
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  manifest:
    name: Assemble signed update manifest
    if: github.ref_type == 'tag' && needs.build.outputs.signed-updater == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: meowcal-sub-2-windows-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Assemble latest.json
        run: |
          python scripts/check_app_version.py --tag "$GITHUB_REF_NAME" --require-head-tag
          python scripts/write_update_manifest.py --dist dist --tag "$GITHUB_REF_NAME" --output dist/latest.json
      - uses: actions/upload-artifact@v7
        with:
          name: meowcal-sub-2-update-manifest-${{ github.sha }}
          path: dist/latest.json
          if-no-files-found: error
          retention-days: 14
