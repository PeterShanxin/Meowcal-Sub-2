version: 2

# Compatible (minor and patch) version updates arrive as one monthly PR per
# ecosystem; each major update arrives as its own PR. Security updates are not
# grouped and are not counted against open-pull-requests-limit.
#
# Pinned release inputs outside these ecosystems keep their own processes:
# config/meowcal-core.lock.json (core-upgrade.yml) and the embedded CPython in
# config/python-runtime.lock.json.
updates:
  # Covers pyproject.toml, whose lower bounds move only when a fix needs them,
  # and the hash-locked wheels in config/backend-requirements.txt that both
  # Windows packages embed. A lock update that changes the dependency set fails
  # CI until scripts/lock_backend_requirements.py is run on the branch.
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The served studio bundle is committed; CI fails until it is rebuilt.
  - package-ecosystem: "npm"
    directory: "/src/meocosub2/overlay/ui"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    ignore:
      # CI and the studio build run Node 22; newer types admit APIs it lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    ignore:
      # The shell's Win32 types must be the windows version Tauri uses; move
      # it with a Tauri upgrade.
      - dependency-name: "windows"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
