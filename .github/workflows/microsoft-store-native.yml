name: Native Microsoft Store package

on:
  workflow_call:
    inputs:
      architecture:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.package.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  package:
    if: inputs.architecture == 'x64' || inputs.architecture == 'arm64'
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14.7'
          architecture: ${{ inputs.architecture }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/meocosub2/overlay/ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r config/backend-requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix src/meocosub2/overlay/ui ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m playwright install chromium
      - name: Build Store edition
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ARCH: ${{ inputs.architecture }}
        run: ./scripts/build-store.ps1 -Architecture $env:PACKAGE_ARCH
      - name: Activate installed package and verify private Studio settings
        shell: powershell
        env:
          PACKAGE_ARCH: ${{ inputs.architecture }}
        run: ./scripts/test-installed-store.ps1 -Package (Get-Item dist/*.msix) -Architecture $env:PACKAGE_ARCH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.architecture == 'x64'
        with:
          name: store-catalog${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: dist/MeowcalSub2-StoreLogo-300.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: store-package-${{ inputs.architecture }}${{ github.event_name == 'release' && format('-{0}', github.run_attempt) || '' }}
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 14
