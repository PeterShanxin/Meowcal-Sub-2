[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meowcal-sub-2"
version = "0.1.0"
description = "Windows subtitle studio: find subtitles, read the screen with OCR, translate on device, and show the result live"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "pysubs2>=1.6",
    "mss>=9.0",
    "rapidfuzz>=3.0",
    "pillow>=10.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "tomli-w>=1.0",
]

[project.scripts]
meowcal-sub-2 = "meocosub2.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.12",
    "playwright>=1.52",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meocosub2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Measured against the code as written: half of all lines fit in 34 characters,
# 95% in 87, and the tail runs to 109. At 88 the formatter would rewrap twice as
# many lines as at 100 without making anything clearer.
line-length = 100
extend-exclude = [
    "src/meocosub2/overlay/static/assets",
    "src/meocosub2/overlay/ui/node_modules",
    "src-tauri/target",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter owns line width. Left on, E501 also condemns the lines it
# cannot split - long URLs, digests, prose in comments - which is noise.
ignore = ["E501"]
