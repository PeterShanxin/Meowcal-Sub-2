[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meowcal-sub-2"
version = "0.1.0"
description = "Windows subtitle studio: find subtitles, read the screen with OCR, translate on device, and show the result live"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "pysubs2>=1.6",
    "mss>=9.0",
    "winocr>=0.0.15",
    "rapidfuzz>=3.0",
    "pillow>=10.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "tomli-w>=1.0",
]

[project.scripts]
meowcal-sub-2 = "meocosub2.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.12",
    "playwright>=1.52",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meocosub2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
