# Full verification remains owned by scripts/verify.ps1. Only an explicitly
# prose-only PR may skip toolchain setup; main and all other changes run it all.
# Native OCR/WebView2/selector acceptance still requires a real desktop run.
name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  verify-x64:
    name: Verify x64
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify and validate prose-only PR
        id: scope
        shell: pwsh
        run: python scripts/ci_scope.py

      - name: Verify CI routing contracts
        if: steps.scope.outputs.scope == 'docs'
        shell: pwsh
        run: python -m unittest discover -s tests -p test_ci_scope.py -v

      - name: Resolve pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        id: core-candidate
        shell: pwsh
        run: |
          $commit = .\scripts\prepare-core-candidate.ps1 -ResolveCommit
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        uses: actions/checkout@v6
        with:
          repository: PeterShanxin/Meowcal-Sub
          ref: ${{ steps.core-candidate.outputs.commit }}
          path: .meowcal-core-candidate
          persist-credentials: false

      - name: Set up Python
        if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Node
        if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          architecture: x64
          cache: "npm"
          cache-dependency-path: "src/meocosub2/overlay/ui/package-lock.json"

      - name: Set up Rust
        if: steps.scope.outputs.scope != 'docs'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: steps.scope.outputs.scope != 'docs'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Python dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install studio dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: npm --prefix src\meocosub2\overlay\ui ci

      - name: Install Playwright headless browser
        if: steps.scope.outputs.scope != 'docs'
        run: python -m playwright install --only-shell chromium

      - name: Verify
        if: steps.scope.outputs.scope != 'docs'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath .\config\meowcal-core.lock.json) {
            .\scripts\verify.ps1
          } else {
            .\scripts\verify.ps1 -CoreCandidateSource .\.meowcal-core-candidate
          }

  verify-arm64:
    name: Verify ARM64
    runs-on: windows-11-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify and validate prose-only PR
        id: scope
        shell: pwsh
        run: python scripts/ci_scope.py

      - name: Verify CI routing contracts
        if: steps.scope.outputs.scope == 'docs'
        shell: pwsh
        run: python -m unittest discover -s tests -p test_ci_scope.py -v

      - name: Resolve pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        id: core-candidate
        shell: pwsh
        run: |
          $commit = .\scripts\prepare-core-candidate.ps1 -ResolveCommit
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Checkout pinned Core candidate
        if: ${{ hashFiles('config/meowcal-core.lock.json') == '' }}
        uses: actions/checkout@v6
        with:
          repository: PeterShanxin/Meowcal-Sub
          ref: ${{ steps.core-candidate.outputs.commit }}
          path: .meowcal-core-candidate
          persist-credentials: false

      - name: Set up Python
        if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
          architecture: arm64
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Set up Node
        if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          architecture: arm64
          cache: "npm"
          cache-dependency-path: "src/meocosub2/overlay/ui/package-lock.json"

      - name: Set up Rust
        if: steps.scope.outputs.scope != 'docs'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        if: steps.scope.outputs.scope != 'docs'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Python dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install studio dependencies
        if: steps.scope.outputs.scope != 'docs'
        run: npm --prefix src\meocosub2\overlay\ui ci

      - name: Install Playwright headless browser
        if: steps.scope.outputs.scope != 'docs'
        run: python -m playwright install --only-shell chromium

      - name: Verify
        if: steps.scope.outputs.scope != 'docs'
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          if (Test-Path -LiteralPath .\config\meowcal-core.lock.json) {
            .\scripts\verify.ps1
          } else {
            .\scripts\verify.ps1 -CoreCandidateSource .\.meowcal-core-candidate
          }
